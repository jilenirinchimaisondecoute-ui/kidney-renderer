name: TikTok connect
on:
  workflow_dispatch:
    inputs:
      code:
        description: "One-time code from callback page"
        required: true
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cryptography
      - name: Exchange code
        env:
          TT_CODE: ${{ github.event.inputs.code }}
          TT_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TT_PASS: ${{ secrets.TIKTOK_ENC_PASS }}
        run: python tiktok_auth.py
      - name: Save token
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add state/tiktok_token.enc
          git commit -m "tiktok token" || true
          git push
