name: studio

on:
  schedule:
    - cron: "0 3 * * *"   # 05:00 بتوقيت ليبيا
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = توليد اليوم، check = فحص المصادر الموثوقة فقط"
        required: false
        default: "daily"
  repository_dispatch:
    types: [tg_reply]

permissions:
  contents: write

concurrency:
  group: studio
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fontconfig libraqm0 libfribidi0
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event_name == 'repository_dispatch' && 'reply' || github.event.inputs.mode || 'daily' }}
          REPLY_TEXT: ${{ github.event.client_payload.text }}
          REPLIED: ${{ github.event.client_payload.replied }}
          CHAT: ${{ github.event.client_payload.chat_id }}
        run: python pipeline.py "$MODE"

      - name: Save state
        if: always()
        run: |
          git config user.name "kidney-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git commit -m "Update state" || echo "nothing to commit"
          git pull --rebase -q || true
          git push || true
