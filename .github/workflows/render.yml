name: render-video

on:
  repository_dispatch:
    types: [render]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fontconfig libraqm0 libfribidi0
          pip install -r requirements.txt

      - name: Save job
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$PAYLOAD" > job.json

      - name: Render video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python render.py job.json

      - name: Publish video as release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-${{ github.run_id }}"
          gh release create "$TAG" out/video.mp4 --title "$TAG" --notes "auto" --repo "${{ github.repository }}"
          echo "VIDEO_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/video.mp4" >> "$GITHUB_ENV"

      - name: Notify Make
        run: |
          CB=$(jq -r .callback_url job.json)
          META=$(jq -c '.meta // {}' job.json)
          jq -n --arg url "$VIDEO_URL" --argjson meta "$META" --slurpfile res out/result.json '{video_url:$url, meta:$meta, duration:$res[0].duration, in_range:$res[0].in_range}' > notify.json
          curl -sS -f -X POST -H "Content-Type: application/json" --data @notify.json "$CB"

      - name: Send to Telegram
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TITLE=$(jq -r '.meta.title // .title // ""' job.json)
          CAP=$(jq -r '.meta.caption // ""' job.json)
          TAGS=$(jq -r '.meta.hashtags // ""' job.json)
          TIME=$(jq -r '.meta.publish_time // ""' job.json)
          DUR=$(jq -r '.duration' out/result.json)
          printf '🎬 %s\n\n%s\n\n%s\n\n⏰ وقت النشر المقترح: %s\n⏱ المدة: %s ث\n\nللموافقة اكتب: ok\nللرفض اكتب: No' "$TITLE" "$CAP" "$TAGS" "$TIME" "$DUR" > caption.txt
          CAPTION=$(jq -Rrs '.[0:1000]' caption.txt)
          curl -sS -f -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendVideo" -F chat_id="$TG_CHAT" -F video=@out/video.mp4 -F supports_streaming=true -F caption="$CAPTION"
